name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Manual trigger

env:
  FLUTTER_VERSION: '3.24.0'
  GO_VERSION: '1.21'
  NODE_VERSION: '18'

jobs:
  # Test Go Backend
  test-backend:
    name: Test Go Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: scp-backend/go.sum

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('scp-backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        working-directory: scp-backend
        run: go mod download

      - name: Run tests
        working-directory: scp-backend
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./scp-backend/coverage.out
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # Test Flutter Consumer App
  test-consumer-app:
    name: Test Consumer App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: scp-mobile-shared
        run: flutter pub get

      - name: Install dependencies
        working-directory: scp-consumer-app
        run: flutter pub get

      - name: Analyze code
        working-directory: scp-consumer-app
        run: flutter analyze

      - name: Run tests
        working-directory: scp-consumer-app
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./scp-consumer-app/coverage/lcov.info
          flags: consumer-app
          name: consumer-app-coverage
          fail_ci_if_error: false

  # Test Flutter Supplier App
  test-supplier-app:
    name: Test Supplier App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: scp-mobile-shared
        run: flutter pub get

      - name: Install dependencies
        working-directory: scp-supplier-sales-app
        run: flutter pub get

      - name: Analyze code
        working-directory: scp-supplier-sales-app
        run: flutter analyze

      - name: Run tests
        working-directory: scp-supplier-sales-app
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./scp-supplier-sales-app/coverage/lcov.info
          flags: supplier-app
          name: supplier-app-coverage
          fail_ci_if_error: false

  # Test Next.js Web Portal
  test-web-portal:
    name: Test Web Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: scp-supplier-web/package-lock.json

      - name: Install dependencies
        working-directory: scp-supplier-web
        run: npm ci

      - name: Run linter
        working-directory: scp-supplier-web
        run: npm run lint

      - name: Build application
        working-directory: scp-supplier-web
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1

  # Build Android APKs with Matrix Strategy
  build-android:
    name: Build Android APK - ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [test-backend, test-consumer-app, test-supplier-app, test-web-portal]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        app:
          - consumer
          - supplier
        include:
          - app: consumer
            app_path: scp-consumer-app
            app_name: Consumer App
            package_name: com.example.scp_consumer_app
          - app: supplier
            app_path: scp-supplier-sales-app
            app_name: Supplier Sales App
            package_name: com.example.scp_supplier_sales_app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: scp-mobile-shared
        run: flutter pub get

      - name: Install dependencies
        working-directory: ${{ matrix.app_path }}
        run: flutter pub get

      - name: Generate localization files
        working-directory: ${{ matrix.app_path }}
        run: flutter gen-l10n

      - name: Create keystore for signing
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          keytool -genkey -v -keystore ${{ matrix.app }}-keystore.jks \
            -storepass ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }} \
            -keypass ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }} \
            -alias ${{ matrix.app }}-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=${{ matrix.app_name }}, OU=Mobile, O=SCP Platform, L=City, ST=State, C=US" \
            || echo "Keystore creation skipped (using debug keys)"

      - name: Set up Android signing
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p ${{ matrix.app_path }}/android/app
          if [ -f "${{ matrix.app }}-keystore.jks" ]; then
            echo "KEYSTORE_FILE=${{ matrix.app }}-keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ matrix.app }}-key" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}" >> $GITHUB_ENV
          fi

      - name: Build APK
        working-directory: ${{ matrix.app_path }}
        run: |
          flutter build apk --release \
            --dart-define=ENV=production \
            --target-platform android-arm64,android-arm
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}

      - name: Get APK path
        id: apk_path
        run: |
          APK_PATH=$(find ${{ matrix.app_path }}/build/app/outputs/flutter-apk -name "*.apk" | head -1)
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK found at: $APK_PATH"

      - name: Get APK info
        id: apk_info
        run: |
          APK_PATH="${{ steps.apk_path.outputs.path }}"
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          APK_NAME=$(basename "$APK_PATH")
          echo "name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "APK: $APK_NAME ($APK_SIZE)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-app-apk
          path: ${{ steps.apk_path.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Generate download link
        id: download_link
        run: |
          echo "Download link will be available in workflow summary"
          echo "artifact_name=${{ matrix.app }}-app-apk" >> $GITHUB_OUTPUT
          echo "app_name=${{ matrix.app_name }}" >> $GITHUB_OUTPUT

  # Generate Workflow Summary
  generate-summary:
    name: Generate Workflow Summary
    runs-on: ubuntu-latest
    needs: [test-backend, test-consumer-app, test-supplier-app, test-web-portal, build-android]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Generate summary
        run: |
          echo "## 🚀 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Go Backend | ${{ needs.test-backend.result == 'success' && '✅ Passed' || needs.test-backend.result == 'failure' && '❌ Failed' || '⏭️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Consumer App | ${{ needs.test-consumer-app.result == 'success' && '✅ Passed' || needs.test-consumer-app.result == 'failure' && '❌ Failed' || '⏭️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Supplier App | ${{ needs.test-supplier-app.result == 'success' && '✅ Passed' || needs.test-supplier-app.result == 'failure' && '❌ Failed' || '⏭️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web Portal | ${{ needs.test-web-portal.result == 'success' && '✅ Passed' || needs.test-web-portal.result == 'failure' && '❌ Failed' || '⏭️ Skipped' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 Android APK Builds" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.build-android.result }}" == "success" ]; then
            echo "| App | Status | Download |" >> $GITHUB_STEP_SUMMARY
            echo "|-----|--------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "| Consumer App | ✅ Built | [Download APK](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
            echo "| Supplier Sales App | ✅ Built | [Download APK](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed. Check the build logs for details." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "APK files are available for download in the workflow artifacts section." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**How to download:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to the [workflow run page](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "2. Scroll down to the 'Artifacts' section" >> $GITHUB_STEP_SUMMARY
          echo "3. Download the APK files:" >> $GITHUB_STEP_SUMMARY
          echo "   - \`consumer-app-apk\` - Consumer App APK" >> $GITHUB_STEP_SUMMARY
          echo "   - \`supplier-app-apk\` - Supplier Sales App APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Artifacts are stored for 30 days." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow Run:** [\#${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

