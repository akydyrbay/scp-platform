name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string
      create_tag:
        description: 'Create git tag'
        required: false
        default: true
        type: boolean

env:
  FLUTTER_VERSION: '3.24.0'
  GO_VERSION: '1.21'
  NODE_VERSION: '18'

jobs:
  build-release:
    name: Build Release APKs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - consumer
          - supplier
        include:
          - app: consumer
            app_path: scp-consumer-app
            app_name: Consumer App
          - app: supplier
            app_path: scp-supplier-sales-app
            app_name: Supplier Sales App

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: scp-mobile-shared
        run: flutter pub get

      - name: Install dependencies
        working-directory: ${{ matrix.app_path }}
        run: flutter pub get

      - name: Generate localization files
        working-directory: ${{ matrix.app_path }}
        run: flutter gen-l10n

      - name: Build release APK
        working-directory: ${{ matrix.app_path }}
        run: |
          flutter build apk --release \
            --dart-define=ENV=production \
            --dart-define=VERSION=${{ github.event.inputs.version }} \
            --target-platform android-arm64,android-arm

      - name: Get APK path
        id: apk_path
        run: |
          APK_PATH=$(find ${{ matrix.app_path }}/build/app/outputs/flutter-apk -name "*.apk" | head -1)
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-app-release-v${{ github.event.inputs.version }}
          path: ${{ steps.apk_path.outputs.path }}
          retention-days: 90

      - name: Create release tag
        if: github.event.inputs.create_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ github.event.inputs.version }}-${{ matrix.app }}" \
            -m "Release ${{ matrix.app_name }} v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}-${{ matrix.app }}"

